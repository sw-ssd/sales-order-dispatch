version: '3'

# iOS:dev/prod scheme 與組態已建立(ios/setup_flavors.rb 為一次性注入腳本,
# 僅供重建參考);Flutter/*-{dev,prod}.xcconfig 以 #include? 連結 Pods 設定。

tasks:
  run:dev:
    desc: dev flavor 執行
    cmd: fvm flutter run --flavor dev -t lib/main_dev.dart
  run:prod:
    desc: prod flavor 執行
    cmd: fvm flutter run --flavor prod -t lib/main_prod.dart
  analyze:
    desc: 靜態分析
    cmd: fvm flutter analyze
  test:
    desc: 全部測試
    cmd: fvm flutter test
  gen:
    desc: auto_route codegen
    cmd: fvm dart run build_runner build --delete-conflicting-outputs
