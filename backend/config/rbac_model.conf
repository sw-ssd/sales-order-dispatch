# Casbin RBAC 模型(T14):角色 × 公司(domain)× 資源 × 動作。
# 對齊設計書 §3.3:Casbin 僅負責「角色 × 公司(domain)× 資源 × 動作」的授權判斷;
# 部門層級資料範圍(dept_admin / staff 僅限自己部門)不由 Casbin domain 承載,
# 統一由 RLS policy 與 repository 查詢條件實現。
#
# 請求 r = (sub 角色 code, obj 資源, act 動作, dom 公司 ID);
# policy p 的 dom 以 "*" 表示全部公司(內建角色 seed 皆為全公司,公司隔離由 RLS 承擔)。

[request_definition]
r = sub, obj, act, dom

[policy_definition]
p = sub, obj, act, dom

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && keyMatch2(r.obj, p.obj) && keyMatch2(r.act, p.act) && (r.dom == p.dom || p.dom == "*")
