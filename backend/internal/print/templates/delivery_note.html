<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
body { font-family: "Noto Sans CJK TC", sans-serif; font-size: 12px; }
h1 { font-size: 20px; }
table { width: 100%; border-collapse: collapse; }
th, td { border: 1px solid #333; padding: 4px 6px; text-align: left; }
.store { page-break-after: always; }
.sign { margin-top: 24px; }
</style>
</head>
<body>
{{range .Stores}}
<div class="store">
<h1>對點單</h1>
<p>{{$.CompanyName}}｜車次 {{$.RouteCode}} {{$.RouteName}}｜出貨日期 {{$.TargetDate}}</p>
<h2>{{.Name}} ({{.CustomerCode}})</h2>
<p>{{.Address}}｜{{.Contact}} {{.Phone}}</p>
<table>
<thead><tr><th>品名</th><th>數量</th><th>單位</th><th>處理規格</th><th>備註</th></tr></thead>
<tbody>
{{range .Items}}<tr><td>{{.Name}}</td><td>{{.Qty}}</td><td>{{.Unit}}</td><td>{{.ProcessSpec}}</td><td>{{.SpecialCut}}</td></tr>{{end}}
</tbody>
</table>
<p class="sign">客戶簽名：＿＿＿＿＿＿　收貨日期：＿＿＿＿＿＿</p>
</div>
{{end}}
</body>
</html>
