version: v2
plugins:
  # Go 訊息 + Connect-Go 服務
  - remote: buf.build/protocolbuffers/go
    out: internal/proto
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    out: internal/proto
    opt: paths=source_relative
  # TS 訊息(protobuf-es v2 *_pb,connect v2 runtime 自 *_pb GenService 匯入)
  - remote: buf.build/bufbuild/es
    out: ../frontend/src/lib/proto
  # 註:connectrpc/es 已移除——最新 v1.6.1 生成 connect v1 風格 *_connect 檔,與
  # @connectrpc/connect v2 不相容且前端零引用(一律自 *_pb GenService 匯入);
  # 待 BSR 釋出 v2 插件後再加回並重生成。
  # Dart 訊息:本地 protoc-gen-dart(dart pub global activate protoc_plugin)。
  # 2026-09-18 升至 connectrpc 2.0.0 / protobuf 6.x / protoc_plugin 25.x:
  # WKT(struct 等)由 protobuf 套件自帶(well_known_types),勿再以 protoc 生成於 app/lib/gen;local plugin 不產 import。
  - local: protoc-gen-dart
    out: ../app/lib/gen
  # Dart Connect 用戶端
  - remote: buf.build/connectrpc/dart
    out: ../app/lib/gen
