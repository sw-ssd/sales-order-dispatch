version: v2
plugins:
  # Go 訊息 + Connect-Go 服務
  - remote: buf.build/protocolbuffers/go
    out: internal/proto
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    out: internal/proto
    opt: paths=source_relative
  # TS 訊息 + Connect-ES 用戶端
  - remote: buf.build/bufbuild/es
    out: ../frontend/src/lib/proto
  - remote: buf.build/connectrpc/es
    out: ../frontend/src/lib/proto
  # Dart 訊息:本地 protoc-gen-dart(dart pub global activate protoc_plugin),
  # 對齊 connectrpc 1.0.0 之 protobuf <5 約束(BSR 最新版產出 protobuf 6 專用碼)。
  # 註:buf 對 local plugin 不生成 import 檔(include_imports 無效);WKT 的 Dart 碼
  # (google/protobuf/struct.*.dart)以 protoc 另行生成,步驟見 backend/Taskfile.yml proto:gen。
  - local: protoc-gen-dart
    out: ../app/lib/gen
  # Dart Connect 用戶端
  - remote: buf.build/connectrpc/dart
    out: ../app/lib/gen
