syntax = "proto3";

package customers.v1;
option go_package = "github.com/salesorder/sales-order-1.0/backend/internal/proto/customers/v1;customersv1";

import "salesorder/v1/common.proto";

// 客戶主檔(04 計畫 3.1, D7/D10/D18)。
// customer_code 由系統取號(公司前綴+6 位自增),建立後不可改。
// 字典欄位(payment/settlement/customer_type/invoice_type)驗證指向 metadicts;
// default_sales_rep_id 驗證指向同公司同部門有效業務。

// Customer:客戶主檔。
message Customer {
  string id = 1;
  string company_id = 2;
  string department_id = 3;          // 可空
  string customer_code = 4;          // 系統取號,建立後不可改
  string name = 5;
  string tax_id = 6;                 // 可空
  string payment_method_id = 7;      // 可空(metadicts 參考)
  string settlement_method_id = 8;   // 可空
  string customer_type_id = 9;       // 可空
  string invoice_type_id = 10;       // 可空
  string default_sales_rep_id = 11;  // 可空(users 業務)
  repeated bool preferred_delivery_days = 12; // 一~六(長度 6)
  repeated int64 promo_tag_ids = 13;          // 促銷分類標籤
  string created_at = 14;            // RFC3339
  string updated_at = 15;            // RFC3339
  string deleted_at = 16;            // RFC3339(可空;include_deleted 時回傳)
}

// CustomerService:客戶主檔管理(dept_admin/staff 限所屬部門)。
service CustomerService {
  // ListCustomers:分頁查詢(keyword 模糊比對 name/customer_code/tax_id;可 include_deleted)。
  rpc ListCustomers(ListCustomersRequest) returns (ListCustomersResponse);
  // GetCustomer:以 id 取單筆(限可見範圍)。
  rpc GetCustomer(GetCustomerRequest) returns (GetCustomerResponse);
  // CreateCustomer:建立客戶(系統取號;字典/業務 reference 驗證)。
  rpc CreateCustomer(CreateCustomerRequest) returns (CreateCustomerResponse);
  // UpdateCustomer:欄位式更新(customer_code 不可改)。
  rpc UpdateCustomer(UpdateCustomerRequest) returns (UpdateCustomerResponse);
  // DeleteCustomer:軟刪除。
  rpc DeleteCustomer(DeleteCustomerRequest) returns (DeleteCustomerResponse);
  // RestoreCustomer:復原(清 deleted_at)。
  rpc RestoreCustomer(RestoreCustomerRequest) returns (RestoreCustomerResponse);

  // 以下為地址簿與聯絡人(3.2.1 / 3.2.2)。
  rpc ListAddresses(ListAddressesRequest) returns (ListAddressesResponse);
  rpc AddAddress(AddAddressRequest) returns (AddAddressResponse);
  rpc UpdateAddress(UpdateAddressRequest) returns (UpdateAddressResponse);
  rpc DeleteAddress(DeleteAddressRequest) returns (DeleteAddressResponse);
  rpc ListContacts(ListContactsRequest) returns (ListContactsResponse);
  rpc AddContact(AddContactRequest) returns (AddContactResponse);
  rpc UpdateContact(UpdateContactRequest) returns (UpdateContactResponse);
  rpc DeleteContact(DeleteContactRequest) returns (DeleteContactResponse);
}

message ListCustomersRequest {
  int32 page = 1;             // 1-based
  int32 page_size = 2;
  string keyword = 3;         // 對 name / customer_code / tax_id 不區分大小寫 OR 模糊比對
  bool include_deleted = 4;   // 是否含已刪除(管理介面)
  string sort = 5;            // name | customer_code | created_at(白名單)
}

message ListCustomersResponse {
  repeated Customer customers = 1;
  salesorder.v1.Pagination pagination = 2;
}

message GetCustomerRequest {
  string id = 1;
}

message GetCustomerResponse {
  Customer customer = 1;
}

message CreateCustomerRequest {
  string name = 1;                    // 必填
  string tax_id = 2;                  // 可空
  string payment_method_id = 3;       // 可空
  string settlement_method_id = 4;    // 可空
  string customer_type_id = 5;        // 可空
  string invoice_type_id = 6;         // 可空
  string default_sales_rep_id = 7;    // 可空
  repeated bool preferred_delivery_days = 8;
  repeated int64 promo_tag_ids = 9;
}

message CreateCustomerResponse {
  Customer customer = 1;
  // D22 建檔連動帳號交付(規格 §4.2/§9.4):臨時密碼僅本次回應出現,系統不留明文。
  string primary_account_name = 2;        // 主帳號帳號名稱(預設=客戶名稱),交付店家
  string primary_temp_password = 3;        // 主帳號臨時密碼(24h,首登強制改)
  string sales_rep_account_name = 4;       // 業務子帳號帳號名稱(預設=客戶名稱(業務)),交付業務
  string sales_rep_temp_password = 5;      // 業務子帳號臨時密碼(24h,首登強制改)
  string account_manage_url = 6;           // 帳號管理深層連結 https://<domain>/customer_account_manage
}

message UpdateCustomerRequest {
  string id = 1;
  optional string name = 2;                  // 出現即更新
  optional string tax_id = 3;                // 出現即更新(可清空)
  optional string payment_method_id = 4;     // 出現即更新(可清空)
  optional string settlement_method_id = 5;
  optional string customer_type_id = 6;
  optional string invoice_type_id = 7;
  optional string default_sales_rep_id = 8;  // 出現即更新(可清空)
  repeated bool preferred_delivery_days = 9; // 出現即取代
  repeated int64 promo_tag_ids = 10;         // 出現即取代
}

message UpdateCustomerResponse {
  Customer customer = 1;
}

message DeleteCustomerRequest {
  string id = 1;
}

message DeleteCustomerResponse {}

message RestoreCustomerRequest {
  string id = 1;
}

message RestoreCustomerResponse {
  Customer customer = 1;
}

// CustomerAddress:客戶地址(3.2.1)。
message CustomerAddress {
  string id = 1;
  string customer_id = 2;
  string type = 3;            // shipping | billing | other
  string recipient_name = 4;
  string phone = 5;
  string address_line = 6;
  string city = 7;
  string postal_code = 8;
  bool is_default = 9;
  string created_at = 10;     // RFC3339
  string updated_at = 11;     // RFC3339
  string deleted_at = 12;     // RFC3339(可空;include_deleted 時回傳)
}

message ListAddressesRequest {
  string customer_id = 1;
  bool include_deleted = 2;
}

message ListAddressesResponse {
  repeated CustomerAddress addresses = 1;
}

message AddAddressRequest {
  string customer_id = 1;
  string type = 2;            // shipping | billing | other
  string recipient_name = 3;  // 必填
  string phone = 4;
  string address_line = 5;    // 必填
  string city = 6;
  string postal_code = 7;
  bool is_default = 8;
}

message AddAddressResponse {
  CustomerAddress address = 1;
}

message UpdateAddressRequest {
  string id = 1;
  optional string type = 2;
  optional string recipient_name = 3;
  optional string phone = 4;
  optional string address_line = 5;
  optional string city = 6;
  optional string postal_code = 7;
  optional bool is_default = 8;
}

message UpdateAddressResponse {
  CustomerAddress address = 1;
}

message DeleteAddressRequest {
  string id = 1;
}

message DeleteAddressResponse {}

// CustomerContact:客戶聯絡人(3.2.2)。
message CustomerContact {
  string id = 1;
  string customer_id = 2;
  string name = 3;
  string title = 4;
  string email = 5;
  string phone = 6;
  bool is_default = 7;
  string created_at = 8;      // RFC3339
  string updated_at = 9;      // RFC3339
  string deleted_at = 10;     // RFC3339(可空;include_deleted 時回傳)
}

message ListContactsRequest {
  string customer_id = 1;
  bool include_deleted = 2;
}

message ListContactsResponse {
  repeated CustomerContact contacts = 1;
}

message AddContactRequest {
  string customer_id = 1;
  string name = 2;            // 必填
  string title = 3;
  string email = 4;
  string phone = 5;
  bool is_default = 6;
}

message AddContactResponse {
  CustomerContact contact = 1;
}

message UpdateContactRequest {
  string id = 1;
  optional string name = 2;
  optional string title = 3;
  optional string email = 4;
  optional string phone = 5;
  optional bool is_default = 6;
}

message UpdateContactResponse {
  CustomerContact contact = 1;
}

message DeleteContactRequest {
  string id = 1;
}

message DeleteContactResponse {}
