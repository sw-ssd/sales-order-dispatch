syntax = "proto3";

package salesorder.v1;
option go_package = "github.com/salesorder/sales-order-1.0/backend/internal/proto/salesorder/v1;salesorderv1";

import "salesorder/v1/common.proto";

// 多租戶主檔(v1;Wave 2):使用者(User)管理。
// 員工帳號(走 OAuth2)與客戶帳號皆以此表示;本 service 管理使用者主檔與角色指派。

// User:使用者帳號。
message User {
  string id = 1;             // 使用者 ID(ent 自增 ID 字串化)
  string company_id = 2;     // 所屬公司 ID
  string department_id = 3;  // 所屬部門 ID(可空)
  string email = 4;          // 員工帳號 email(公司內唯一)
  string name = 5;           // 姓名
  string phone = 6;          // 電話(可空)
  string employee_no = 7;    // 員工編號(可空)
  string status = 8;         // active | inactive | pending
  string role = 9;           // super|company_admin|dept_admin|staff|guest|customer|developer
  bool is_customer = 10;     // 是否客戶帳號
  string account_name = 11;  // 客戶帳號登入名(可空)
}

// UserService:使用者管理。
service UserService {
  // ListUsers:分頁列出使用者,可依 company_id / department_id / role / status 篩選。
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  // GetUser:取得單一使用者(不含 password_hash)。
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  // CreateUser:建立員工帳號(super 直接建立;password_hash 依 OAuth 流程填補)。
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  // UpdateUser:更新使用者(name / department_id / phone / employee_no / status)。
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  // AssignRole:角色指派(含 guest 審核:status pending → active 並指派部門與角色)。
  rpc AssignRole(AssignRoleRequest) returns (AssignRoleResponse);
  // Deactivate:停用帳號(status → inactive, token_version+1, 刪 session)。
  rpc Deactivate(DeactivateRequest) returns (DeactivateResponse);
  // ForceLogout:強制登出(token_version+1, 使該使用者在途憑證失效)。
  rpc ForceLogout(ForceLogoutRequest) returns (ForceLogoutResponse);
}

message ListUsersRequest {
  int32 page = 1;        // 1-based 頁碼
  int32 page_size = 2;   // 每頁筆數
  string company_id = 3; // 篩選:公司 ID(操作者範圍內)
  string department_id = 4; // 篩選:部門 ID
  string role = 5;       // 篩選:角色 code
  string status = 6;     // 篩選:active | inactive | pending(空 = 全部)
}

message ListUsersResponse {
  repeated User users = 1;
  Pagination pagination = 2;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  User user = 1;
}

message CreateUserRequest {
  string name = 1;         // 姓名(必填)
  string email = 2;        // email(必填)
  string company_id = 3;   // 所屬公司(必填)
  string department_id = 4; // 所屬部門(可空)
  string role = 5;         // 角色 code(必填)
  string phone = 6;        // 電話(可空)
  string employee_no = 7;  // 員工編號(可空)
}

message CreateUserResponse {
  User user = 1;
}

message UpdateUserRequest {
  string user_id = 1;
  optional string name = 2;         // 出現即更新
  optional string department_id = 3; // 出現即更新
  optional string phone = 4;        // 出現即更新(含清空)
  optional string employee_no = 5;  // 出現即更新(含清空)
  optional string status = 6;       // 出現即更新
}

message UpdateUserResponse {
  User user = 1;
}

message AssignRoleRequest {
  string user_id = 1;      // 目標使用者
  string role = 2;         // 新角色 code
  string department_id = 3; // 部門(guest 審核或 dept_admin/staff 角色必填)
}

message AssignRoleResponse {
  User user = 1;
}

message DeactivateRequest {
  string user_id = 1;
}

message DeactivateResponse {}

message ForceLogoutRequest {
  string user_id = 1;
}

message ForceLogoutResponse {}
