syntax = "proto3";

package platform.v1;
option go_package = "github.com/salesorder/sales-order-1.0/backend/internal/proto/platform/v1;platformv1";

// 平台域(v1;D34–D39):平台營運工具(operator 身分)與租戶端權益投影。
// 硬規則:platform.* 能力不得出現在租戶 GetAbility(S11);租戶身分不得呼叫 PlatformAdminService。

// TenantSummary:平台視角的租戶概況(跨租戶,僅 operator 可讀)。
message TenantSummary {
  string company_id = 1;
  string company_name = 2;
  string plan_code = 3;
  string plan_name = 4;
  string subscription_status = 5;  // trialing | active | past_due | suspended | cancelled | none
  int32  seat_count = 6;
  string current_period_end = 7;   // RFC3339,可空
  bool   overdue = 8;              // 有未付期別
  string trial_ends_at = 10;       // RFC3339,可空（試用中才有；未結項 #27）
  string grace_until = 11;         // RFC3339,可空（past_due 才有；未結項 #27）
}

// PlatformPagination:平台查詢統一分頁結果。
message PlatformPagination {
  int32 page = 1;
  int32 page_size = 2;
  int32 total = 3;
}

message ListTenantsRequest {
  int32  page = 1;
  int32  page_size = 2;
  string keyword = 3;              // 公司名稱/識別碼模糊
  string status = 4;               // 訂閱狀態篩選,可空
}

message ListTenantsResponse {
  repeated TenantSummary tenants = 1;
  PlatformPagination pagination = 2;
}

message GetTenantRequest {
  string company_id = 1;
}

message GetTenantResponse {
  TenantSummary tenant = 1;
  repeated TenantOverride overrides = 2;
}

// TenantOverride:平台對單一租戶的功能覆寫。
message TenantOverride {
  string id = 1;
  string feature_code = 2;
  bool   enabled_set = 3;          // 是否指定 enabled
  bool   enabled = 4;
  bool   limit_set = 5;
  int64  limit_value = 6;
  string reason = 7;
  string owner = 8;
  string expires_at = 9;
}

message ListPlansRequest {}

message ListPlansResponse {
  repeated Plan plans = 1;
}

// Plan:方案(含各計費週期價格)。
message Plan {
  string id = 1;
  string code = 2;
  string name = 3;
  string status = 4;
  int32  sort_order = 5;
  repeated PlanPrice prices = 6;
}

message PlanPrice {
  string billing_cycle = 1;
  string base_price = 2;
  string seat_price = 3;
  string currency = 4;
  string effective_from = 5;
}

message GetPlanEntitlementsRequest {
  string plan_code = 1;
}

message GetPlanEntitlementsResponse {
  repeated FeatureEntitlement entitlements = 1;
  repeated Feature features = 2;   // 完整功能清單(供矩陣顯示未設定的格)
}

// Feature:可授權功能定義。
message Feature {
  string code = 1;
  string type = 2;                 // boolean | integer
  string unit = 3;
  string description = 4;
}

message FeatureEntitlement {
  string feature_code = 1;
  bool   enabled = 2;
  bool   limit_set = 3;
  int64  limit_value = 4;
}

message ListPlatformAuditRequest {
  int32  page = 1;
  int32  page_size = 2;
  string target_type = 3;
  string target_id = 4;
}

message ListPlatformAuditResponse {
  repeated PlatformAuditEntry entries = 1;
  PlatformPagination pagination = 2;
}

message PlatformAuditEntry {
  string id = 1;
  string operator_email = 2;
  string action = 3;
  string target_type = 4;
  string target_id = 5;
  string reason = 6;
  string created_at = 7;
}

// PlatformAdminService:平台營運(operator session;租戶身分一律拒絕)。
service PlatformAdminService {
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse);
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse);
  rpc GetPlanEntitlements(GetPlanEntitlementsRequest) returns (GetPlanEntitlementsResponse);
  rpc ListPlatformAudit(ListPlatformAuditRequest) returns (ListPlatformAuditResponse);

  // --- 平台寫入(T9)。共同契約:每個寫入都必須帶 reason(平台稽核必填),
  // actor 一律是 cookie 上的真實 operator;資料與稽核同一個交易(失敗不留半成品)。
  rpc ListReceivables(ListReceivablesRequest) returns (ListReceivablesResponse);
  rpc RecordPayment(RecordPaymentRequest) returns (RecordPaymentResponse);
  rpc CreateSubscription(CreateSubscriptionRequest) returns (CreateSubscriptionResponse);
  rpc SetSeatCount(SetSeatCountRequest) returns (SetSeatCountResponse);
  rpc ChangePlan(ChangePlanRequest) returns (ChangePlanResponse);
  rpc CancelSubscription(CancelSubscriptionRequest) returns (CancelSubscriptionResponse);
  rpc GetBillingSettings(GetBillingSettingsRequest) returns (GetBillingSettingsResponse);
  rpc UpdateBillingSettings(UpdateBillingSettingsRequest) returns (UpdateBillingSettingsResponse);
  rpc SetTenantOverride(SetTenantOverrideRequest) returns (SetTenantOverrideResponse);
  rpc RevokeTenantOverride(RevokeTenantOverrideRequest) returns (RevokeTenantOverrideResponse);
  rpc UpsertPlanPrice(UpsertPlanPriceRequest) returns (UpsertPlanPriceResponse);
  rpc SetPlanEntitlement(SetPlanEntitlementRequest) returns (SetPlanEntitlementResponse);
  rpc CreateOperator(CreateOperatorRequest) returns (CreateOperatorResponse);
  rpc DisableOperator(DisableOperatorRequest) returns (DisableOperatorResponse);
  // 未結項 #23：自己的身分（console 依角色隱藏操作）。後端仍是唯一決策者；
  // 前端只據此 disable 按鈕，不做授權判斷。
  rpc GetOperatorSelf(GetOperatorSelfRequest) returns (GetOperatorSelfResponse);
  // 未結項 #28：某訂閱的期別歷史（租戶詳情的「期別」段；spec §2.4）。
  rpc ListSubscriptionPeriods(ListSubscriptionPeriodsRequest) returns (ListSubscriptionPeriodsResponse);
}

// --- 待收款與收款 ---

message ListReceivablesRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListReceivablesResponse {
  repeated Receivable rows = 1;
  PlatformPagination pagination = 2;
}

// Receivable:一期未付的帳(供 console 顯示與匯出 CSV)。G5 的平台自營公司不算租戶,不列入。
message Receivable {
  string company_id = 1;
  string company_name = 2;
  string plan_code = 3;
  int32  period_no = 4;
  string amount = 5;        // 兩位小數字串("1500.00")
  string period_end = 6;    // RFC3339
  string status = 7;        // open(未付;已過期末者即逾期)
}

message RecordPaymentRequest {
  string company_id = 1;
  int32  period_no = 2;     // 0 = 當前(最新)一期
  string amount = 3;        // 金額字串;空 = 採用期別快照金額(不支援部分付款)
  string provider = 4;      // manual | ecpay | …;空 = manual
  string external_ref = 5;  // 匯款帳號／交易號(重送冪等以此比對)
  string invoice_no = 6;
  string invoice_status = 7;
  string buyer_tax_id = 8;  // 統一編號
  string carrier = 9;       // 載具
  string note = 10;         // 短收／溢收備註(不改變期別金額)
  string reason = 11;       // 必填
}

message RecordPaymentResponse {
  int32  period_no = 1;
  string status = 2;
}

// --- 開通(建立訂閱與第一期;B-1:在此之前沒有任何程式路徑會建立訂閱列) ---

message CreateSubscriptionRequest {
  string company_id = 1;
  string plan_code = 2;     // 必須是 active 的方案,且該計費週期在當下有生效價目
  string billing_cycle = 3; // monthly | yearly
  int32  seat_count = 4;    // 必須 > 0
  string trial_ends_at = 5; // RFC3339 且必須是未來;空 = 不試用(直接 active)
  string reason = 6;        // 必填
}

message CreateSubscriptionResponse {
  string subscription_id = 1;
  string status = 2;         // trialing(有試用)| active
  string plan_code = 3;
  string billing_cycle = 4;
  int32  seat_count = 5;
  string trial_ends_at = 6;  // 空 = 非試用
  int32  first_period_no = 7;
  string first_period_end = 8;    // RFC3339(依計費週期:月 +1 月、年 +1 年;月底夾擠見後端)
  string first_period_amount = 9; // 兩位小數字串("1600.00");當期生效價的快照
}

// --- 訂閱生命週期(G6;v1 不做按日比例計費:變更一律下一期生效) ---

message SetSeatCountRequest {
  string company_id = 1;
  int32  seat_count = 2;    // 新席位數;不得小於目前使用中的席次
  string reason = 3;        // 必填
}

message SetSeatCountResponse {
  int32 seat_count = 1;
}

message ChangePlanRequest {
  string company_id = 1;
  string plan_code = 2;     // 新方案;下一期生效,當期不動
  string reason = 3;        // 必填
}

message ChangePlanResponse {
  string plan_code = 1;
  string effective_from = 2; // 下一期起日(RFC3339)
}

message CancelSubscriptionRequest {
  string company_id = 1;
  bool   at_period_end = 2;  // v1 僅支援 true(期末終止);false 回 PLAT-3001
  string reason = 3;         // 必填
}

message CancelSubscriptionResponse {
  string cancelled_at = 1;
  string service_until = 2;  // 服務提供到這個時間(期末)
}

// --- 營運參數(G5/5-6:cron 讀 settings,不硬編) ---

message GetBillingSettingsRequest {}

message GetBillingSettingsResponse {
  repeated BillingSetting settings = 1;
}

// BillingSetting:一項可由介面調整的營運參數(trial_days／grace_days／lead_days)。
message BillingSetting {
  string key = 1;
  string value = 2;
  string description = 3;
}

message UpdateBillingSettingsRequest {
  repeated BillingSetting settings = 1;
  string reason = 2;        // 必填
}

message UpdateBillingSettingsResponse {
  repeated BillingSetting settings = 1;
}

// --- 租戶例外(override) ---

message SetTenantOverrideRequest {
  string company_id = 1;
  string feature_code = 2;
  bool   enabled_set = 3;   // false = 不覆寫 boolean 維度
  bool   enabled = 4;
  bool   limit_set = 5;     // false = 不覆寫限額維度(不限額請給 limit_set + 極大值)
  int64  limit_value = 6;
  string owner = 7;         // 承諾者(平台側人員)
  string expires_at = 8;    // RFC3339;空 = 不過期
  string reason = 9;        // 必填
}

message SetTenantOverrideResponse {
  string id = 1;
}

message RevokeTenantOverrideRequest {
  string override_id = 1;
  string reason = 2;        // 必填
}

message RevokeTenantOverrideResponse {
  string company_id = 1;
  string feature_code = 2;
}

// --- 方案價目與權益 ---

message UpsertPlanPriceRequest {
  string plan_code = 1;
  string billing_cycle = 2;  // monthly | yearly
  string base_price = 3;     // 金額字串("1500.00"),後端 money.ParseCents
  string seat_price = 4;
  string currency = 5;       // 空 = TWD
  string reason = 6;         // 必填
}

message UpsertPlanPriceResponse {}

message SetPlanEntitlementRequest {
  string plan_code = 1;
  string feature_code = 2;
  bool   enabled = 3;
  bool   limit_set = 4;      // false = 不限額(NULL),不是 0
  int64  limit_value = 5;
  string reason = 6;         // 必填
}

message SetPlanEntitlementResponse {}

// --- 操作者白名單(S8) ---

message CreateOperatorRequest {
  string email = 1;
  string name = 2;
  string role = 3;           // operator | admin;空 = operator
  string reason = 4;         // 必填
}

message CreateOperatorResponse {
  string id = 1;
}

message DisableOperatorRequest {
  string operator_id = 1;
  string reason = 2;         // 必填
}

message DisableOperatorResponse {}

message GetOperatorSelfRequest {}

message GetOperatorSelfResponse {
  string operator_id = 1;
  string email = 2;
  string role = 3;  // operator | admin
}

message ListSubscriptionPeriodsRequest {
  string company_id = 1;
}

message SubscriptionPeriod {
  int32  period_no = 1;
  string period_start = 2;   // RFC3339
  string period_end = 3;     // RFC3339
  string status = 4;         // open | paid | void
  string amount = 5;         // 兩位小數字串
  string paid_at = 6;        // RFC3339，可空
  string invoice_no = 7;
  string external_ref = 8;
  string note = 9;
}

message ListSubscriptionPeriodsResponse {
  repeated SubscriptionPeriod periods = 1;
}

// GetTenantEntitlementsRequest:租戶端唯讀投影(自己的公司;前端據此 disable 按鈕與顯示用量)。
message GetTenantEntitlementsRequest {}

message GetTenantEntitlementsResponse {
  string plan_code = 1;
  string plan_name = 2;
  string status = 3;
  string trial_ends_at = 4;
  repeated Usage usage = 5;
}

// Usage:單一功能的使用量投影。
message Usage {
  string feature_code = 1;
  bool   enabled = 2;
  bool   limit_set = 3;
  int64  limit_value = 4;
  int64  used = 5;
}

// TenantEntitlementService:租戶端權益投影(租戶 session;唯讀)。
service TenantEntitlementService {
  rpc GetTenantEntitlements(GetTenantEntitlementsRequest) returns (GetTenantEntitlementsResponse);
}
