syntax = "proto3";

package masters.v1;
option go_package = "github.com/salesorder/sales-order-1.0/backend/internal/proto/masters/v1;mastersv1";

import "google/protobuf/struct.proto";
import "salesorder/v1/common.proto";

// 部門級主檔(04 計畫 3.4, D10/D18)。四實體皆 company_id/department_id + 軟刪除 + 稽核;
// code 部門內部分唯一;跨部門不可見。權限 dept_admin/staff 限本部門。

// ---- Warehouse(3.4.1) ----
message Warehouse {
  string id = 1;
  string company_id = 2;
  string department_id = 3;
  string code = 4;
  string name = 5;
  string address = 6;
  bool is_active = 7;
  string created_at = 8;
  string updated_at = 9;
  string deleted_at = 10;
}

service WarehouseService {
  rpc ListWarehouses(ListWarehousesRequest) returns (ListWarehousesResponse);
  rpc CreateWarehouse(CreateWarehouseRequest) returns (CreateWarehouseResponse);
  rpc UpdateWarehouse(UpdateWarehouseRequest) returns (UpdateWarehouseResponse);
  rpc DeleteWarehouse(DeleteWarehouseRequest) returns (DeleteWarehouseResponse);
  rpc RestoreWarehouse(RestoreWarehouseRequest) returns (RestoreWarehouseResponse);
}

message ListWarehousesRequest { int32 page = 1; int32 page_size = 2; string keyword = 3; bool include_deleted = 4; }
message ListWarehousesResponse { repeated Warehouse warehouses = 1; salesorder.v1.Pagination pagination = 2; }
message CreateWarehouseRequest { string code = 1; string name = 2; string address = 3; bool is_active = 4; }
message CreateWarehouseResponse { Warehouse warehouse = 1; }
message UpdateWarehouseRequest { string id = 1; optional string code = 2; optional string name = 3; optional string address = 4; optional bool is_active = 5; }
message UpdateWarehouseResponse { Warehouse warehouse = 1; }
message DeleteWarehouseRequest { string id = 1; }
message DeleteWarehouseResponse {}
message RestoreWarehouseRequest { string id = 1; }
message RestoreWarehouseResponse { Warehouse warehouse = 1; }

// ---- Route(3.4.2) ----
message Route {
  string id = 1;
  string company_id = 2;
  string department_id = 3;
  string code = 4;
  string name = 5;
  string description = 6;
  int32 sort_order = 7;
  bool is_active = 8;
  string created_at = 9;
  string updated_at = 10;
  string deleted_at = 11;
}

service RouteService {
  rpc ListRoutes(ListRoutesRequest) returns (ListRoutesResponse);
  rpc CreateRoute(CreateRouteRequest) returns (CreateRouteResponse);
  rpc UpdateRoute(UpdateRouteRequest) returns (UpdateRouteResponse);
  rpc DeleteRoute(DeleteRouteRequest) returns (DeleteRouteResponse);
  rpc RestoreRoute(RestoreRouteRequest) returns (RestoreRouteResponse);
}

message ListRoutesRequest { int32 page = 1; int32 page_size = 2; string keyword = 3; bool include_deleted = 4; }
message ListRoutesResponse { repeated Route routes = 1; salesorder.v1.Pagination pagination = 2; }
message CreateRouteRequest { string code = 1; string name = 2; string description = 3; int32 sort_order = 4; bool is_active = 5; }
message CreateRouteResponse { Route route = 1; }
message UpdateRouteRequest { string id = 1; optional string code = 2; optional string name = 3; optional string description = 4; optional int32 sort_order = 5; optional bool is_active = 6; }
message UpdateRouteResponse { Route route = 1; }
message DeleteRouteRequest { string id = 1; }
message DeleteRouteResponse {}
message RestoreRouteRequest { string id = 1; }
message RestoreRouteResponse { Route route = 1; }

// ---- ProcessingSpec(3.4.3, 泛化自 cutting_specs) ----
message ProcessingSpec {
  string id = 1;
  string company_id = 2;
  string department_id = 3;
  string code = 4;
  string name = 5;
  string kind = 6;                    // 開放集,metadicts processing_kind 背書
  bool applies_to_processing = 7;     // 加工室揀
  bool applies_to_picking = 8;        // 配送揀(可同時 true)
  google.protobuf.Struct attributes = 9; // 自由結構指令,後端不解析
  int32 sort_order = 10;
  bool is_active = 11;
  string created_at = 12;
  string updated_at = 13;
  string deleted_at = 14;
}

service ProcessingSpecService {
  rpc ListProcessingSpecs(ListProcessingSpecsRequest) returns (ListProcessingSpecsResponse);
  rpc CreateProcessingSpec(CreateProcessingSpecRequest) returns (CreateProcessingSpecResponse);
  rpc UpdateProcessingSpec(UpdateProcessingSpecRequest) returns (UpdateProcessingSpecResponse);
  rpc DeleteProcessingSpec(DeleteProcessingSpecRequest) returns (DeleteProcessingSpecResponse);
  rpc RestoreProcessingSpec(RestoreProcessingSpecRequest) returns (RestoreProcessingSpecResponse);
}

message ListProcessingSpecsRequest { int32 page = 1; int32 page_size = 2; string keyword = 3; bool include_deleted = 4; }
message ListProcessingSpecsResponse { repeated ProcessingSpec processing_specs = 1; salesorder.v1.Pagination pagination = 2; }
message CreateProcessingSpecRequest {
  string code = 1; string name = 2; string kind = 3;
  bool applies_to_processing = 4; bool applies_to_picking = 5;
  google.protobuf.Struct attributes = 6; int32 sort_order = 7; bool is_active = 8;
}
message CreateProcessingSpecResponse { ProcessingSpec processing_spec = 1; }
message UpdateProcessingSpecRequest {
  string id = 1;
  optional string code = 2; optional string name = 3; optional string kind = 4;
  optional bool applies_to_processing = 5; optional bool applies_to_picking = 6;
  google.protobuf.Struct attributes = 7; optional int32 sort_order = 8; optional bool is_active = 9;
}
message UpdateProcessingSpecResponse { ProcessingSpec processing_spec = 1; }
message DeleteProcessingSpecRequest { string id = 1; }
message DeleteProcessingSpecResponse {}
message RestoreProcessingSpecRequest { string id = 1; }
message RestoreProcessingSpecResponse { ProcessingSpec processing_spec = 1; }

// ---- ProductCategory(3.4.4) ----
message ProductCategory {
  string id = 1;
  string company_id = 2;
  string department_id = 3;
  string code = 4;
  string name = 5;
  int32 sort_order = 6;
  bool is_active = 7;
  string created_at = 8;
  string updated_at = 9;
  string deleted_at = 10;
}

service ProductCategoryService {
  rpc ListProductCategories(ListProductCategoriesRequest) returns (ListProductCategoriesResponse);
  rpc CreateProductCategory(CreateProductCategoryRequest) returns (CreateProductCategoryResponse);
  rpc UpdateProductCategory(UpdateProductCategoryRequest) returns (UpdateProductCategoryResponse);
  rpc DeleteProductCategory(DeleteProductCategoryRequest) returns (DeleteProductCategoryResponse);
  rpc RestoreProductCategory(RestoreProductCategoryRequest) returns (RestoreProductCategoryResponse);
}

message ListProductCategoriesRequest { int32 page = 1; int32 page_size = 2; string keyword = 3; bool include_deleted = 4; }
message ListProductCategoriesResponse { repeated ProductCategory product_categories = 1; salesorder.v1.Pagination pagination = 2; }
message CreateProductCategoryRequest { string code = 1; string name = 2; int32 sort_order = 3; bool is_active = 4; }
message CreateProductCategoryResponse { ProductCategory product_category = 1; }
message UpdateProductCategoryRequest { string id = 1; optional string code = 2; optional string name = 3; optional int32 sort_order = 4; optional bool is_active = 5; }
message UpdateProductCategoryResponse { ProductCategory product_category = 1; }
message DeleteProductCategoryRequest { string id = 1; }
message DeleteProductCategoryResponse {}
message RestoreProductCategoryRequest { string id = 1; }
message RestoreProductCategoryResponse { ProductCategory product_category = 1; }
