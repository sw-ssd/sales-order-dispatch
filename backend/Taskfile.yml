version: '3'

tasks:
  dev:
    desc: air hot reload 開發模式
    cmd: air

  run:
    desc: 直接執行 server
    cmd: go run ./cmd/server

  test:
    desc: 全部測試（-count=1 關結果快取，未結項 #35）
    cmd: go test -count=1 ./...

  test:integration:
    desc: 整合測試(testcontainers;需本機容器 runtime,env 已固化於此)
    # 本機無 docker CLI(只有 podman machine):DOCKER_HOST 指向 podman API socket;
    # ryuk 在 podman 下無法運作(掛載 host socket、bridge 網路皆失敗),故停用
    # (容器改由測試的 t.Cleanup 終止)。
    # 環境已備妥現成 PostgreSQL 時,可改設 INTEGRATION_TEST_DSN 跳過容器(gating 名沿用既有整合測試)。
    vars:
      PODMAN_SOCK:
        sh: podman machine inspect | jq -r '.[0].ConnectionInfo.PodmanSocket.Path'
    env:
      DOCKER_HOST: "unix://{{.PODMAN_SOCK}}"
      TESTCONTAINERS_RYUK_DISABLED: "true"
    cmd: go test -tags integration -count=1 ./... {{.CLI_ARGS}}
    # 附加參數直接透傳(Task v3 需明寫 {{.CLI_ARGS}}),例如:
    #   task test:integration -- -run TestIntegrationOpenFGAMigration -v

  check:
    desc: fmt + vet + lint + test（D31-2；test 帶 -count=1，未結項 #35）
    cmds:
      - go fmt ./...
      - go vet ./...
      # go vet 與 golangci-lint 預設**不載入** `//go:build integration` 的檔案（未帶 build tag
      # 時整個檔案被排除），故 D31-2 的閘門看不見整合測試 —— 曾因此讓 22 個 errcheck/staticcheck
      # 問題在多個套件裡無聲累積。此處顯式帶上 tag，讓整合測試與一般測試受同一套規則約束。
      - go vet -tags integration ./...
      - golangci-lint run
      - golangci-lint run --build-tags integration ./...
      - go test -count=1 ./...
      # 模組邊界閘門（2026-09-30 platform 拆分，2026-10-01 手動 split 為獨立 repo）：
      # platform 模組不得反向依賴產品模組（ent／authz／dbtenant／services／auth／platformhost）。
      # 編譯器已強制（platform/go.mod 不依賴產品模組），此處再顯式釘一道。
      # platform 是 sibling 獨立 repo(../platform)；本地開發存在，CI 待 PLATFORM_REPO_URL 設後亦存在。
      - |
        if [ -d ../platform ]; then
          deps=$(cd ../platform && go list -deps ./... | grep -E 'sales-order-1.0/backend/(ent|internal/(authz|dbtenant|services|auth|platformhost))')
          if [ -n "$deps" ]; then echo "platform 反向依賴產品模組:"; echo "$deps"; exit 1; fi
        fi

  platform:check:
    desc: 檢查 platform（最低 v0.5.0）整合進度（輸出編號對應 docs/platform/MIGRATION.md）
    cmd: ./scripts/platform-check.sh

  platform:check:strict:
    desc: 同上，但一定回非零（整合完成後給 CI 用）
    cmd: PLATFORM_CHECK_STRICT=1 ./scripts/platform-check.sh

  vuln:
    desc: govulncheck 弱點掃描（D31-2）
    cmd: govulncheck ./...

  migrate:up:
    desc: 套用全部 migration
    cmd: go run ./cmd/migrate up

  migrate:status:
    desc: 查看 migration 狀態
    cmd: go run ./cmd/migrate status

  migrate:down:
    desc: 回滾最近一筆 migration
    cmd: go run ./cmd/migrate down

  seed:
    desc: 執行冪等 seeder
    cmd: go run ./cmd/seed

  platform:cron:
    desc: 執行一趟平台排程（逾期 → 凍結 → 產生期別 → 事件派送；--date 可覆寫時間，例 -- -date 2026-10-01T03:00:00Z）
    # 單趟、不內建迴圈:重複執行由觸發器負責（正式環境是 k8s CronJob）。
    cmd: go run ./cmd/platform-cron {{.CLI_ARGS}}

  db:app-password:
    desc: 為本機開發資料庫設定 app_rw 密碼（migration 00022 只建角色不建密碼）
    # 本 Taskfile 不載入 .env：使用前先 export DATABASE_ADMIN_URL（owner 連線）。
    cmds:
      - psql "$DATABASE_ADMIN_URL" -c "ALTER ROLE app_rw WITH PASSWORD 'app_rw'"

  proto:gen:
    desc: buf 產生 Go/TS/Dart 型別(本地 protoc-gen-dart 需於 PATH)
    env:
      PATH: "{{.HOME}}/.pub-cache/bin:{{env \"PATH\" | default \"\"}}"
    cmd: buf generate
    # 附註:protobuf 6.x 起 WKT(struct 等)由 protobuf 套件自帶(well_known_types),
    # 無需以 protoc 另行生成;protoc-gen-dart 需 dart pub global activate protoc_plugin(≥25 對應 protobuf 6)。
