version: '3'

tasks:
  dev:
    desc: air hot reload 開發模式
    cmd: air

  run:
    desc: 直接執行 server
    cmd: go run ./cmd/server

  test:
    desc: 全部測試
    cmd: go test ./...

  check:
    desc: fmt + vet + lint + test（D31-2）
    cmds:
      - go fmt ./...
      - go vet ./...
      - golangci-lint run
      - go test ./...

  vuln:
    desc: govulncheck 弱點掃描（D31-2）
    cmd: govulncheck ./...

  migrate:up:
    desc: 套用全部 migration
    cmd: go run ./cmd/migrate up

  migrate:status:
    desc: 查看 migration 狀態
    cmd: go run ./cmd/migrate status

  migrate:down:
    desc: 回滾最近一筆 migration
    cmd: go run ./cmd/migrate down

  seed:
    desc: 執行冪等 seeder
    cmd: go run ./cmd/seed

  proto:gen:
    desc: buf 產生 Go/TS/Dart 型別(本地 protoc-gen-dart 需於 PATH)
    env:
      PATH: "{{.HOME}}/.pub-cache/bin:{{env \"PATH\" | default \"\"}}"
    cmd: buf generate
    # 附註:buf 對 local plugin 不生成 import 檔(include_imports 僅對 remote 生效),
    # google.protobuf.Struct 等 WKT 的 Dart 碼需以 protoc 另行生成:
    #   WKT=$(ls -d ~/.cache/buf/v3/modules/*/buf.build/protocolbuffers/wellknowntypes/*/files)
    #   protoc --dart_out=../app/lib/gen -I proto -I "$WKT" \
    #     proto/salesorder/v1/company.proto google/protobuf/struct.proto
