name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions: read-all

jobs:
  go:
    name: Go(backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: backend
      - name: Test # -count=1 關結果快取(未結項 #35:快取命中會假綠)
        run: go test -count=1 ./...
      # 產生檔（碼表與三端常數）必須與 registry 同步：跑完 go generate 後不得有 diff。
      # git diff 對 **untracked** 檔無感（產生器新建了檔案卻忘記 commit 時會放行），故另以
      # git status --porcelain 檢查同一組路徑。
      # platform-console/src/lib/errcode.ts 是 Plan C Task 10 的產物，**已落地並在清單內**：
      # 產生器只在該目錄存在時輸出該檔（不存在時兩個檢查對它只是 no-op），故路徑不存在不會紅。
      # 現況（2026-09-21 實測）：`go generate ./internal/errcode` 會印出它並回報「未變更」。
      - name: Error codes up to date
        run: |
          paths="../docs/error-codes.md ../frontend/src/lib/errcode.ts ../platform-console/src/lib/errcode.ts ../app/lib/gen/errcode.dart"
          go generate ./internal/errcode
          git diff --exit-code -- $paths
          test -z "$(git status --porcelain -- $paths)"
      # proto 產生檔（Go／TS／Dart 三端）必須與 proto 定義同步：跑完 task proto:gen 後不得有 diff。
      # git diff 對 untracked 檔無感（產生器新建了檔案卻忘記 commit 時會放行），故同 errcode 的做法，
      # 另以 git status --porcelain 檢查同一組路徑。
      # platform-console/src/lib/proto 是 Plan C Task 10 的產物（buf.gen.yaml 追加的第二個 TS 輸出），
      # **已落地並在清單內**；路徑不存在時兩個檢查對它只是 no-op。
      # 現況（2026-09-21 實測）：以等效的 TS-only template 重跑 buf generate 後，該目錄與
      # frontend/src/lib/proto 皆逐位元組相同。
      # 工具鏈必須自備且**釘版**：Go／TS／Dart 的 BSR 遠端 plugin 各自在 `buf.gen.yaml` 以 `:vX.Y.Z` 釘住
      # （未釘版時 BSR 一上架新版，所有產生檔一起漂移、閘門全紅），Dart 訊息另走本地 protoc-gen-dart，
      # 三個版本（buf／Dart SDK／protoc_plugin）任一不釘，下一次上架或升版就會讓所有 PR 的產生檔
      # 無故漂移。此處用的即產出已入 commit 的那一組：buf 1.73.0、Dart 3.13.3（.fvmrc 的 fvm stable）、
      # protoc_plugin 25.1.0 —— 換版時請連同產生檔一起 commit（並在本註解更新）。
      - uses: arduino/setup-task@v2
        with:
          version: 3.53.1
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.73.0"
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.3"
      - name: Proto generated files up to date
        run: |
          paths="internal/proto ../frontend/src/lib/proto ../platform-console/src/lib/proto ../app/lib/gen"
          dart pub global activate protoc_plugin 25.1.0
          export PATH="$HOME/.pub-cache/bin:$PATH"
          task proto:gen
          git diff --exit-code -- $paths
          test -z "$(git status --porcelain -- $paths)"
      - name: Build
        run: go build ./cmd/...
      - name: Vulnerability scan(D31-2)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  go-integration:
    name: Go integration(backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum
      # 真 PostgreSQL 的行為(遷移語法、唯一性語意、OpenFGA schema/版本表、啟動 fail-fast)
      # 以 testcontainers 起拋棄式容器驗證。build tag `integration` 讓預設 `go test ./...` 不起容器
      # (backend/AGENTS.md §4);runner 自帶 docker,故不需任何 TESTCONTAINERS_* env。
      - name: Test(integration)
        run: go test -tags integration -count=1 ./...

  frontend:
    name: Frontend(SolidJS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C frontend typecheck
      - run: pnpm -C frontend lint
      # 前端回歸守門：表格/表單/元件庫的契約測試都在這裡（先前 CI 未跑測試）
      - run: pnpm -C frontend test
      - run: pnpm -C frontend build

  platform-console:
    name: Platform console(SolidJS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # platform-console 是 pnpm workspace 成員(root pnpm-workspace.yaml),安裝在 root 一次即可。
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C platform-console typecheck
      - run: pnpm -C platform-console lint
      - run: pnpm -C platform-console test
      - run: pnpm -C platform-console build
      # 平台 console 的兩個產生檔(src/lib/proto、src/lib/errcode.ts)已由 go job 的兩個冪等閘門涵蓋
      # (paths 清單各自列入該目錄),此處不重複跑。

  flutter:
    name: App(Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      # app/.fvmrc 釘 stable;CI 直接以 stable channel 對齊(免裝 fvm)
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
