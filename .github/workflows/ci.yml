name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions: read-all

jobs:
  go:
    name: Go(backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: backend
      - name: Test
        run: go test ./...
      # 產生檔（碼表與三端常數）必須與 registry 同步：跑完 go generate 後不得有 diff。
      # platform-console/src/lib/errcode.ts 是 Plan C 的產物，尚未落地；路徑不存在時 git diff 對它是
      # no-op，Plan C 落地後會自動納入（產生器只在該目錄存在時輸出該檔）。
      - name: Error codes up to date
        run: |
          go generate ./internal/errcode
          git diff --exit-code -- ../docs/error-codes.md ../frontend/src/lib/errcode.ts \
            ../platform-console/src/lib/errcode.ts ../app/lib/gen/errcode.dart
      - name: Build
        run: go build ./cmd/server
      - name: Vulnerability scan(D31-2)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  go-integration:
    name: Go integration(backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum
      # 真 PostgreSQL 的行為(遷移語法、唯一性語意、OpenFGA schema/版本表、啟動 fail-fast)
      # 以 testcontainers 起拋棄式容器驗證。build tag `integration` 讓預設 `go test ./...` 不起容器
      # (backend/AGENTS.md §4);runner 自帶 docker,故不需任何 TESTCONTAINERS_* env。
      - name: Test(integration)
        run: go test -tags integration -count=1 ./...

  frontend:
    name: Frontend(SolidJS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C frontend typecheck
      - run: pnpm -C frontend lint
      # 前端回歸守門：表格/表單/元件庫的契約測試都在這裡（先前 CI 未跑測試）
      - run: pnpm -C frontend test
      - run: pnpm -C frontend build

  flutter:
    name: App(Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      # app/.fvmrc 釘 stable;CI 直接以 stable channel 對齊(免裝 fvm)
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
